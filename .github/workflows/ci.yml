name: CI

on:
  pull_request:
    branches:
      - V2
      - main
  push:
    branches:
      - V2

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test -- --ci

      - name: Build
        env:
          NEXT_PUBLIC_LOGOUT_DELAY_SECONDS: "5"
          NEXT_PUBLIC_BATCH_ENRICHMENT_DELAY_SECONDS: "5"
          NEXT_PUBLIC_AI_SEARCH_CREDIT_DEDUCTION: "1"
          NEXT_PUBLIC_ENRICHMENT_CREDIT_DEDUCTION: "1"
          NEXT_PUBLIC_EXPORT_CREDIT_DEDUCTION: "1"
        run: npm run local-build
